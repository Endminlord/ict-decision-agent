<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>治理观测台 · Live</title>
<style>
:root{--bg:#12121c;--card:#1b1b2a;--acc:#7c6cff;--ok:#3ddc97;--warn:#ffb454;--dim:#8a8aa3;--fg:#e8e8f2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 "Noto Sans SC",system-ui,sans-serif;padding:24px}
h1{font-size:20px;margin-bottom:4px}
h1 .dim{font-size:13px;color:var(--dim);font-weight:normal}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid #2a2a3d;border-radius:10px;padding:14px 16px}
.card h2{font-size:14px;color:var(--acc);margin-bottom:8px}
.card.wide{grid-column:1/3}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;margin-left:6px}
.ok{background:#123c2c;color:var(--ok)} .warn{background:#3c2c12;color:var(--warn)} .bad{background:#3c1212;color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 6px;border-bottom:1px solid #26263a;text-align:left}
td.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#ts{color:var(--dim);font-size:11px}
.layer{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #26263a;font-size:14px}
.big{font-size:18px;font-weight:700}
</style>
</head>
<body>
<h1>治理观测台 <span class="dim">Governance Console · LIVE</span><span id="ledgerBadge" class="badge warn">连接中…</span></h1>
<div class="sub">判定权外置的只读投影 —— 账本哈希链实时校验 · 五层成绩自动跟随最新报告 · 导入状态直读单元。<span id="ts"></span></div>
<div class="grid">
  <div class="card wide">
    <h2>① 五层评测成绩（自动跟随最新 evidence 报告）</h2>
    <div id="scores"><span class="dim">加载中…</span></div>
    <div id="gates" style="margin-top:6px"></div>
  </div>
  <div class="card">
    <h2>② 免疫账本（append-only SHA-256 链）</h2>
    <div id="ledger"><span class="dim">加载中…</span></div>
  </div>
  <div class="card">
    <h2>③ 语料导入 / 系统状态</h2>
    <div id="imp"><span class="dim">加载中…</span></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function j(u){const r=await fetch(u);return r.json()}
async function refresh(){
  try{
    const [L,S,I]=await Promise.all([j('/api/ledger'),j('/api/scores'),j('/api/import')]);
    // ledger
    const ok=L.verify&&L.verify.ok;
    $('ledgerBadge').textContent=(ok?'链校验通过 · ':'链异常 · ')+L.count+' 笔';
    $('ledgerBadge').className='badge '+(ok?'ok':'bad');
    $('ledger').innerHTML='<table><tr><th>#</th><th>动作</th><th>目标</th><th>版本</th><th>摘要</th></tr>'+
      L.records.map(r=>'<tr><td class="mono">'+(r.rec_id||'').slice(4,12)+'</td><td>'+r.action+'</td><td class="mono">'+(r.target||'').split('/').pop()+'</td><td>'+(r.version||'')+'</td><td class="dim">'+String(r.note||'').slice(0,42)+'…</td></tr>').join('')+'</table>';
    // scores
    const order=['R','M','X','C','G'],name={R:'R 检索',M:'M 多跳',X:'X 拒答',C:'C 跨语言',G:'G 图检索'};
    const kind={pass_rate:'通过率',chain_pass_rate:'链通过率',refusal_rate:'拒答率'};
    $('scores').innerHTML=order.map(k=>{const v=S.layers[k]||{};
      if(v.rate===undefined) return '<div class="layer"><span>'+name[k]+'</span><span class="dim">满库 replay 后点亮</span></div>';
      return '<div class="layer"><span>'+name[k]+' <span class="dim">'+(v.source||'')+'</span></span><span class="big">'+v.passed+'/'+v.n+' <span class="dim">'+kind[v.kind]+' '+v.rate.toFixed(2)+'</span></span></div>'}).join('');
    $('gates').innerHTML=Object.keys(S.gates||{}).length?
      Object.entries(S.gates).map(([k,g])=>'<span class="badge '+(g.decision==='PASS'?'ok':(g.decision?'warn':''))+'">'+k+' 门控: '+(g.decision||'?')+' (p='+g.p+')</span>').join(' '):
      '<span class="dim">门控决定：满库 A2 落地后显示</span>';
    // import
    $('imp').innerHTML='<div class="layer"><span>import-corpus 单元</span><span class="badge '+(I.unit==='active'?'ok':'warn')+'">'+I.unit+'</span></div>'+
      '<div class="mono dim" style="margin-top:6px;white-space:pre">'+(I.marker_tail||[]).join('\n')+'</div>';
    $('ts').textContent=' · 刷新于 '+I.now;
  }catch(e){$('ts').textContent=' · 刷新失败: '+e}
}
refresh(); setInterval(refresh,10000);
</script>
</body>
</html>
